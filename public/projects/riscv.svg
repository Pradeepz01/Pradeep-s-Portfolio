<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110e20" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f0b24" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <pattern id="grid-riscv" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(139,92,246,0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-3)" />
  <rect width="800" height="450" fill="url(#grid-riscv)" />

  <circle cx="250" cy="210" r="160" fill="#8b5cf6" opacity="0.12" />
  <circle cx="560" cy="210" r="160" fill="#6366f1" opacity="0.10" />

  <!-- RISC-V RV32I Core Block -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="260" height="230" rx="14" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="24" y="34" fill="#f5f3ff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">RISC-V RV32I Core</text>
    <text x="24" y="52" fill="#c4b5fd" font-family="monospace" font-size="11">Instruction &amp; Load/Store Unit</text>

    <!-- Operations supported -->
    <rect x="20" y="70" width="220" height="32" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="1" />
    <text x="32" y="91" fill="#ddd6fe" font-family="monospace" font-size="11">LB, LH, LW (Byte/Half/Word)</text>

    <rect x="20" y="110" width="220" height="32" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="1" />
    <text x="32" y="131" fill="#ddd6fe" font-family="monospace" font-size="11">SB, SH, SW (Store Ops)</text>

    <rect x="20" y="150" width="220" height="32" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="1" />
    <text x="32" y="171" fill="#ddd6fe" font-family="monospace" font-size="11">Sign / Zero Extension Logic</text>

    <rect x="20" y="190" width="220" height="26" rx="4" fill="#3b0764" />
    <text x="130" y="207" fill="#a78bfa" font-family="monospace" font-size="10.5" text-anchor="middle">CEG FABLESS DEV Core</text>
  </g>

  <!-- AXI Bus Channels -->
  <g transform="translate(350, 110)">
    <path d="M 0 20 L 80 20" stroke="#a855f7" stroke-width="2" />
    <path d="M 80 45 L 0 45" stroke="#ec4899" stroke-width="2" />
    <path d="M 0 70 L 80 70" stroke="#a855f7" stroke-width="2" />
    <path d="M 80 95 L 0 95" stroke="#ec4899" stroke-width="2" />
    <path d="M 80 120 L 0 120" stroke="#8b5cf6" stroke-width="2" />
    <text x="40" y="10" fill="#c084fc" font-family="monospace" font-size="10" text-anchor="middle">AXI4-Lite</text>
    <text x="40" y="145" fill="#f472b6" font-family="monospace" font-size="9" text-anchor="middle">5 Channels</text>
  </g>

  <!-- Data Memory IP Block -->
  <g transform="translate(440, 75)">
    <rect x="0" y="0" width="280" height="230" rx="14" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="24" y="34" fill="#f5f3ff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">AXI Data Memory (DMEM)</text>
    
    <rect x="20" y="55" width="240" height="38" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1" />
    <text x="32" y="79" fill="#c7d2fe" font-family="monospace" font-size="11">Address Decoding &amp; Byte Enable</text>

    <rect x="20" y="100" width="240" height="38" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1" />
    <text x="32" y="124" fill="#c7d2fe" font-family="monospace" font-size="11">Synchronous SRAM Interface</text>

    <rect x="20" y="145" width="240" height="38" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1" />
    <text x="32" y="169" fill="#c7d2fe" font-family="monospace" font-size="11">Vivado Waveform Verified</text>

    <rect x="20" y="190" width="240" height="26" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="140" y="207" fill="#818cf8" font-family="monospace" font-size="10.5" text-anchor="middle">RTL Simulation &amp; Synthesis OK</text>
  </g>

  <g transform="translate(80, 335)">
    <rect x="0" y="0" width="640" height="42" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#4338ca" stroke-width="1" />
    <text x="30" y="26" fill="#f5f3ff" font-family="system-ui, sans-serif" font-weight="600" font-size="14">RISC-V Data Memory AXI IP — CEG Fabless</text>
    <text x="610" y="26" fill="#c084fc" font-family="monospace" font-size="12" text-anchor="end">Verilog / Vivado / RV32I</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-1)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <circle cx="250" cy="225" r="180" fill="#06b6d4" opacity="0.12" />
  <circle cx="580" cy="225" r="160" fill="#3b82f6" opacity="0.10" />

  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="220" height="220" rx="16" fill="url(#chip-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <g stroke="#38bdf8" stroke-width="2" opacity="0.6">
      <line x1="-12" y1="40" x2="0" y2="40" /><line x1="-12" y1="70" x2="0" y2="70" /><line x1="-12" y1="100" x2="0" y2="100" /><line x1="-12" y1="130" x2="0" y2="130" /><line x1="-12" y1="160" x2="0" y2="160" />
      <line x1="220" y1="40" x2="232" y2="40" /><line x1="220" y1="70" x2="232" y2="70" /><line x1="220" y1="100" x2="232" y2="100" /><line x1="220" y1="130" x2="232" y2="130" /><line x1="220" y1="160" x2="232" y2="160" />
    </g>
    <circle cx="28" cy="28" r="6" fill="#0284c7" />
    <text x="110" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">STM32F446RE</text>
    <text x="110" y="110" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">ARM Cortex-M4</text>
    <text x="110" y="135" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">180 MHz | 512KB Flash</text>
    
    <rect x="35" y="160" width="150" height="26" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <circle cx="50" cy="173" r="4" fill="#22c55e" />
    <text x="115" y="177" fill="#e0f2fe" font-family="monospace" font-size="10" text-anchor="middle">BOOTLOADER ACTIVE</text>
  </g>

  <path d="M 332 190 L 440 190" stroke="url(#cyan-glow)" stroke-width="2.5" stroke-dasharray="6,4" />
  <polygon points="440,185 452,190 440,195" fill="#38bdf8" />
  <text x="386" y="178" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">UART RX/TX</text>

  <g transform="translate(460, 75)">
    <rect x="0" y="0" width="240" height="230" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Flash Memory Layout</text>
    
    <rect x="18" y="48" width="204" height="42" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1" />
    <text x="28" y="66" fill="#38bdf8" font-family="monospace" font-weight="600" font-size="11">Sector 0-1: Bootloader</text>
    <text x="28" y="82" fill="#64748b" font-family="monospace" font-size="10">0x0800_0000 (32 KB)</text>

    <rect x="18" y="98" width="204" height="52" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1" />
    <text x="28" y="118" fill="#4ade80" font-family="monospace" font-weight="600" font-size="11">Sector 2+: User App</text>
    <text x="28" y="134" fill="#64748b" font-family="monospace" font-size="10">0x0800_8000 (480 KB)</text>
    <text x="28" y="145" fill="#22c55e" font-family="monospace" font-size="9">Verified CRC32 &amp; Reset Vector</text>

    <rect x="18" y="160" width="96" height="22" rx="4" fill="#0284c7" fill-opacity="0.15" />
    <text x="66" y="175" fill="#38bdf8" font-family="monospace" font-size="9.5" text-anchor="middle">Rollback Safe</text>

    <rect x="122" y="160" width="100" height="22" rx="4" fill="#22c55e" fill-opacity="0.15" />
    <text x="172" y="175" fill="#4ade80" font-family="monospace" font-size="9.5" text-anchor="middle">CRC Integrity</text>

    <rect x="18" y="188" width="204" height="22" rx="4" fill="#6366f1" fill-opacity="0.15" />
    <text x="120" y="203" fill="#a5b4fc" font-family="monospace" font-size="9.5" text-anchor="middle">Custom Packet Framing Protocol</text>
  </g>

  <g transform="translate(100, 335)">
    <rect x="0" y="0" width="600" height="42" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="30" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Secure Bootloader &amp; OTA Firmware Update Framework</text>
    <text x="570" y="26" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="end">STM32 / Bare-Metal C</text>
  </g>
</svg>
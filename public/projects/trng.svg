<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c14" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#021310" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid-trng" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(16,185,129,0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-2)" />
  <rect width="800" height="450" fill="url(#grid-trng)" />

  <circle cx="250" cy="210" r="160" fill="#10b981" opacity="0.10" />
  <circle cx="560" cy="210" r="160" fill="#14b8a6" opacity="0.10" />

  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="290" height="230" rx="14" fill="#042f2e" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="24" y="32" fill="#ecfdf5" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Ring Oscillator Entropy Source</text>
    
    <!-- Inverter chain -->
    <g transform="translate(24, 55)">
      <!-- INV 1 -->
      <polygon points="10,15 45,30 10,45" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <circle cx="50" cy="30" r="4" fill="#042f2e" stroke="#34d399" stroke-width="1.5" />
      <!-- INV 2 -->
      <polygon points="70,15 105,30 70,45" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <circle cx="110" cy="30" r="4" fill="#042f2e" stroke="#34d399" stroke-width="1.5" />
      <!-- INV 3 -->
      <polygon points="130,15 165,30 130,45" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <circle cx="170" cy="30" r="4" fill="#042f2e" stroke="#34d399" stroke-width="1.5" />

      <!-- Feedback line -->
      <path d="M 175 30 L 220 30 L 220 65 L 0 65 L 0 30 L 10 30" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3" />
    </g>

    <!-- Phase Jitter Waveform -->
    <g transform="translate(24, 150)">
      <text x="0" y="-8" fill="#6ee7b7" font-family="monospace" font-size="11">Phase Jitter &amp; Metastability Sampling</text>
      <path d="M 0 20 L 20 20 L 20 0 L 42 0 L 42 20 L 61 20 L 61 0 L 85 0 L 85 20 L 103 20 L 103 0 L 129 0 L 129 20 L 148 20 L 148 0 L 175 0 L 175 20 L 240 20" fill="none" stroke="#10b981" stroke-width="2" />
    </g>
  </g>

  <!-- Connect arrow -->
  <path d="M 380 190 L 425 190" stroke="url(#emerald-glow)" stroke-width="2.5" stroke-dasharray="4,4" />
  <polygon points="425,185 437,190 425,195" fill="#10b981" />

  <!-- Conditioning Logic Panel -->
  <g transform="translate(440, 75)">
    <rect x="0" y="0" width="280" height="230" rx="14" fill="#042f2e" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="24" y="32" fill="#ecfdf5" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Entropy Conditioning &amp; Tests</text>

    <rect x="20" y="50" width="240" height="38" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="32" y="74" fill="#6ee7b7" font-family="monospace" font-size="11">Von Neumann De-biaser</text>

    <rect x="20" y="96" width="240" height="38" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="32" y="120" fill="#6ee7b7" font-family="monospace" font-size="11">NIST Health &amp; Repetition Tests</text>

    <rect x="20" y="142" width="240" height="38" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="32" y="166" fill="#6ee7b7" font-family="monospace" font-size="11">Tiny Tapeout Sky130 ASIC Cell</text>

    <rect x="20" y="188" width="240" height="26" rx="4" fill="#022c22" />
    <text x="140" y="205" fill="#34d399" font-family="monospace" font-size="10.5" text-anchor="middle">10110010 01101001 ... (True Random)</text>
  </g>

  <g transform="translate(80, 335)">
    <rect x="0" y="0" width="640" height="42" rx="8" fill="#042f2e" fill-opacity="0.8" stroke="#065f46" stroke-width="1" />
    <text x="30" y="26" fill="#ecfdf5" font-family="system-ui, sans-serif" font-weight="600" font-size="14">True Random Number Generator (TRNG) — Tiny Tapeout Sky130</text>
    <text x="610" y="26" fill="#34d399" font-family="monospace" font-size="12" text-anchor="end">Verilog / ASIC RTL</text>
  </g>
</svg>